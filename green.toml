# The green condition for token-forge's meta lane. Written first; every entry is
# a command that must exit 0. See docs/operating-model.md for the levels and
# suite/modules/loop/README.md for the exit codes.

name         = "token-forge:meta"
level        = 1
max_attempts = 3
loop         = "0.3.0"

# What consumers get. Changing any of these changes the token set another repo
# reads, so a push that touches one is lane 3 regardless of size. The token-set
# version lives in src/export.js, so a version bump is an interface touch.
interface = [
  "src/export.js",   # the export format — $version, $type, $forge
  "src/tokens.js",   # the vocabulary and derive() — which keys exist
  "src/fonts.js",    # the font stacks exported
  "sets/**",         # published sets + manifest, served from Pages
]

# The lane's own levels, cheapest first — check stops at the first failure.
checks = [
  "npm test",                          # Fast: colour maths, derivation, presets, exports, control tree
  "node scripts/full-check.mjs",       # Full: every preset renders in every export format
  "node scripts/contract-check.mjs",   # Contract: the tokens module validates every preset's export
]

# This lane touches only its own repo. A diff outside these is lane 3 by construction.
scope = [
  "docs/**",
  "src/**",
  "test/**",
  "scripts/**",
  "green.toml",
  ".gitignore",
  "package.json",
  "index.html",
  "README.md",
  "CLAUDE.md",
  ".github/**",
  "LICENSE",
]
